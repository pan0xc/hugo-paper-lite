<figure>
  <blockquote{{ with .Attributes.cite }} cite="{{ . }}" {{ end }}>
    {{ .Text }}
    </blockquote>
    {{ with .Attributes.caption }}
    <figcaption>
      {{ with $.Attributes.cite }}
      <cite>
        {{ $.Attributes.caption | markdownify }}
      </cite>
      {{ else }}
      {{ . | markdownify }}
      {{ end }}
    </figcaption>
    {{ end }}
</figure>
