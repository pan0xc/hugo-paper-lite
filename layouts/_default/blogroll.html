{{- define "main" -}}

<section>
<ul class="space-y-list">
{{ range .Site.Data.blogroll }}
    <li class="relative">
      <span class="text-gray-500 dark:text-gray-400">
        <time>
          {{ time.Format ":date_medium" .date }}
        </time>
        {{ (urls.Parse .url).Host }}
      </span>
      <h2 class="text-h2 min-w-0 truncate">
          {{ .title }}
      </h2>
      <a class="absolute inset-0 text-[0px]" href="{{- .url -}}">
        {{- .title -}}
      </a>
    </li>
{{ end }}
</ul>
</section>

{{- end }}
