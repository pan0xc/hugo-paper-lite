<header class="flex flex-row h-16 w-full justify-between px-fluid-m border-b border-gray-300/80 dark:border-gray-700/80">
  {{- $url := .RelPermalink -}}<!---->
  {{- with site.Menus.main -}}
  <nav class="hidden md:flex items-center gap-x-fluid-xl w-full">
    <a class="grow-2 py-2 text-fluid-h3" href="/">{{ site.Title }}</a>
    {{- range . -}}
    <a
      class="text-fluid-h3 py-fluid-2xs hover:underline aria-[current=page]:underline decoration-2"
      {{ if $.IsMenuCurrent .Menu . }}aria-current="page"{{ end }}
      href="{{ .URL }}"
    >{{ .Name }}</a>
    {{- end -}}
  </nav>

  <nav class="md:hidden flex items-center justify-between w-full">
    <a class="text-fluid-h3" href="/">{{ site.Title }}</a>
    <div class="grid shrink-0 place-items-center">
      <button id="open-menu" type="button" command="show-modal" commandfor="menu-modal" aria-label="open menu" class="col-start-1 row-start-1">
        <svg class="size-fluid-m">
          <use href="/icons.svg#menu"></use>
        </svg>
      </button>
      <button id="close-menu" type="button" command="close" commandfor="menu-modal" aria-label="close menu" class="col-start-1 row-start-1">
        <svg class="size-6">
          <use href="/icons.svg#close"></use>
        </svg>
      </button>
    </div>
  </nav>

  <dialog id="menu-modal" closedby="any">
    <nav class="h-[calc(100%-4rem)] flex flex-col items-center justify-center gap-y-fluid-xl">
      {{- range . -}}
      <a 
        class="text-fluid-h3 py-fluid-xs px-fluid-m active:bg-gray-200/80 dark:active:bg-gray-700/80 aria-[current=page]:bg-gray-200/80 dark:aria-[current=page]:bg-gray-700/80 rounded-full"
        {{ if $.IsMenuCurrent .Menu . }}aria-current="page"{{ end }}
        href="{{ .URL }}">{{ .Name }}</a>
      {{- end -}}
    </nav>
  </dialog>
  {{- end -}}<!---->
</header>
